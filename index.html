<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASSTRA AI - Assistant Intelligent</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ASSTRA AI - Votre assistant intelligent.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    :root {
      --primary: #6657f5;
      --primary-dark: #5141df;
      --purple: #a855f7;
      --background: #f8f9fd;
      --white: #ffffff;
      --text: #20243a;
      --muted: #8b90a5;
      --border: #e9eaf2;
      --sidebar-width: 270px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--background); color: var(--text); height: 100dvh; overflow: hidden; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; width: 100%; height: 100dvh; }
    .sidebar { width: var(--sidebar-width); flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 16px; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 4px; margin-bottom: 30px; }
    .brand-logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(135deg, #6657f5, #a855f7); display: flex; align-items: center; justify-content: center; color: white; font-size: 23px; }
    .brand-name { font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #6657f5, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .new-chat-btn { width: 100%; border: 0; padding: 13px; border-radius: 12px; background: linear-gradient(135deg, #6657f5, #7665fa); color: white; font-size: 14px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 9px; }
    .history-title { margin: 29px 8px 12px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
    .history-item { display: flex; align-items: center; gap: 8px; padding: 11px 10px; border-radius: 10px; color: #646981; font-size: 13px; cursor: pointer; }
    .history-item:hover { background: #f5f4ff; }
    .history-item.active { background: #efedff; color: var(--primary-dark); }
    .history-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-chat { border: 0; background: transparent; color: #9296a9; font-size: 16px; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
    .header { height: 68px; display: flex; align-items: center; gap: 13px; padding: 0 24px; background: white; border-bottom: 1px solid var(--border); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 23px; }
    .message-row { display: flex; align-items: flex-start; gap: 11px; max-width: 850px; width: 100%; margin: 0 auto; }
    .message-row.user-row { justify-content: flex-end; }
    .avatar { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
    .assistant-avatar { color: white; background: linear-gradient(135deg, #6657f5, #a855f7); }
    .user-avatar { background: #eeecff; }
    .message { max-width: calc(100% - 45px); padding: 14px 17px; border-radius: 15px; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    .message.user { background: linear-gradient(135deg, #6657f5, #7465f7); color: white; border-bottom-right-radius: 4px; }
    .message.assistant { background: white; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .message-image { display: block; max-width: 240px; max-height: 240px; object-fit: contain; margin-top: 8px; border-radius: 10px; }
    .image-preview { display: none; align-items: center; gap: 12px; padding: 10px 20px; background: #f1efff; border-top: 1px solid #e6e1ff; }
    .image-preview img { width: 47px; height: 47px; border-radius: 9px; object-fit: cover; }
    .composer-area { background: white; border-top: 1px solid var(--border); padding: 16px 20px 12px; }
    .composer { width: min(900px, 100%); margin: 0 auto; display: flex; align-items: flex-end; gap: 9px; padding: 9px; border: 1px solid #dedff0; border-radius: 17px; background: white; }
    .composer textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 10px 3px; font-size: 14px; background: transparent; }
    .send-btn { height: 40px; padding: 0 17px; border: 0; border-radius: 11px; background: linear-gradient(135deg, #6657f5, #7665fa); color: white; font-weight: 700; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">✨</div>
      <div class="brand-name">ASSTRA AI</div>
    </div>
    <button class="new-chat-btn" id="newChatBtn"><span>＋</span> Nouvelle discussion</button>
    <div class="history-title">Discussions récentes</div>
    <div class="history-list" id="historyList"></div>
  </aside>
  <main class="main">
    <header class="header">
      <strong>ASSTRA AI Assistant</strong>
    </header>
    <section class="chat-messages" id="chatMessages"></section>
    <div class="image-preview" id="imagePreview">
      <img id="previewImg" alt="Aperçu">
      <div class="image-preview-info"><strong id="previewName">Image prête</strong></div>
      <button class="remove-image" id="removeImageBtn">×</button>
    </div>
    <footer class="composer-area">
      <div class="composer">
        <button class="icon-btn" id="imageBtn">📷</button>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden>
        <textarea id="userInput" rows="1" placeholder="Écris ta question ou pose une image..."></textarea>
        <button class="send-btn" id="sendBtn">Envoyer 🚀</button>
      </div>
    </footer>
  </main>
</div>
<script>
  const STORAGE_KEY = "asstra_ai_conversations_v3";
  let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let activeConversationId = null;
  let selectedImage = null;
  let isSending = false;

  const chatMessages = document.getElementById("chatMessages");
  const historyList = document.getElementById("historyList");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const imageInput = document.getElementById("imageInput");
  const imageBtn = document.getElementById("imageBtn");
  const imagePreview = document.getElementById("imagePreview");
  const previewImg = document.getElementById("previewImg");
  const removeImageBtn = document.getElementById("removeImageBtn");

  if (conversations.length === 0) createConversation();
  else openConversation(conversations[0].id);

  function createConversation() {
    const c = { id: Date.now().toString(), title: "Nouvelle discussion", messages: [], updatedAt: Date.now() };
    conversations.unshift(c);
    activeConversationId = c.id;
    saveAndRender();
  }

  function openConversation(id) {
    activeConversationId = id;
    clearImage();
    saveAndRender();
  }

  function getActive() {
    return conversations.find(c => c.id === activeConversationId);
  }

  function saveAndRender() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    } catch {
      alert("Stockage local plein. Supprimez d'anciennes discussions.");
    }
    renderHistory();
    renderChat();
  }

  function renderHistory() {
    historyList.replaceChildren();
    conversations.forEach(c => {
      const item = document.createElement("div");
      item.className = "history-item " + (c.id === activeConversationId ? "active" : "");
      item.innerHTML = `<span>💬</span><span class="history-name">${c.title}</span>`;
      item.onclick = () => openConversation(c.id);
      historyList.appendChild(item);
    });
  }

  function renderChat() {
    chatMessages.replaceChildren();
    const c = getActive();
    if (!c || c.messages.length === 0) {
      chatMessages.innerHTML = `<div style="text-align:center;margin:auto;"><h1>Bienvenue sur <span>ASSTRA AI</span></h1><p>Posez vos questions ou envoyez une photo !</p></div>`;
      return;
    }
    c.messages.forEach(m => {
      const row = document.createElement("div");
      row.className = "message-row " + (m.role === "user" ? "user-row" : "");
      row.innerHTML = `<div class="avatar ${m.role === 'user' ? 'user-avatar' : 'assistant-avatar'}">${m.role === 'user' ? '👤' : '✦'}</div>
                       <div class="message ${m.role}">${m.text ? marked.parse(m.text) : ''}${m.image ? `<img src="${m.image}" class="message-image">` : ''}</div>`;
      chatMessages.appendChild(row);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  imageBtn.onclick = () => imageInput.click();
  imageInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      selectedImage = reader.result;
      previewImg.src = selectedImage;
      imagePreview.style.display = "flex";
    };
    reader.readAsDataURL(file);
  };

  removeImageBtn.onclick = clearImage;
  function clearImage() {
    selectedImage = null;
    imageInput.value = "";
    imagePreview.style.display = "none";
  }

  document.getElementById("newChatBtn").onclick = createConversation;

  sendBtn.onclick = async () => {
    if (isSending) return;
    const text = userInput.value.trim();
    if (!text && !selectedImage) return;

    const c = getActive();
    if (!c) return;

    const userMsg = { role: "user", text, image: selectedImage };
    c.messages.push(userMsg);
    if (c.messages.length === 1) c.title = text ? text.slice(0, 30) : "Analyse d'image";
    
    userInput.value = "";
    const imgToSend = selectedImage;
    clearImage();
    saveAndRender();

    isSending = true;
    sendBtn.disabled = true;

    // تجهيز الهستوري للباك إند بدون تكرار الصور الثقيلة
    const historyPayload = c.messages.slice(0, -1).map(m => ({
      role: m.role,
      parts: [{ text: m.text || "" }]
    }));

    try {
      const res = await fetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: text,
          image: imgToSend,
          contents: historyPayload
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur serveur");

      c.messages.push({ role: "model", text: data.reply });
    } catch (err) {
      c.messages.push({ role: "model", text: "⚠️ Erreur: " + err.message });
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      c.updatedAt = Date.now();
      saveAndRender();
    }
  };
</script>
</body>
</html>
