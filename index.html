<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASSTRA AI - Assistant Intelligent</title>
  <meta name="description" content="ASSTRA AI - Votre assistant intelligent multilingue avec recherche web et analyse d'images.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f7f8fc; display: flex; height: 100vh; color: #333; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .brand-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
    .brand-name { font-size: 18px; font-weight: bold; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .new-chat-btn { background: #6366f1; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .new-chat-btn:hover { background: #4f46e5; }

    /* Main Chat Area */
    .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
    .chat-header { padding: 15px 25px; border-bottom: 1px solid #e5e7eb; background: #fff; font-weight: 600; color: #4b5563; }
    .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: #fcfdff; }
    
    .message { max-width: 75%; padding: 14px 18px; border-radius: 14px; line-height: 1.6; font-size: 15px; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .message.user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.assistant { background: white; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e5e7eb; }
    
    /* Input Container */
    .input-container { padding: 20px 25px; background: white; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 12px; }
    .input-container input[type="text"] { flex: 1; padding: 14px 18px; border: 1px solid #d1d5db; border-radius: 12px; outline: none; font-size: 15px; transition: border-color 0.2s; }
    .input-container input[type="text"]:focus { border-color: #6366f1; }
    
    .icon-btn { background: #f3f4f6; border: none; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: background 0.2s; }
    .icon-btn:hover { background: #e5e7eb; }
    
    .send-btn { background: #6366f1; color: white; border: none; padding: 0 22px; height: 45px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
    .send-btn:hover { background: #4f46e5; }

    /* Image Preview Tag */
    #imagePreviewIndicator { font-size: 12px; color: #6366f1; padding: 5px 25px; background: #eef2ff; display: none; align-items: center; gap: 5px; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <div class="brand-logo">✨</div>
      <div class="brand-name">ASSTRA AI</div>
    </div>
    <button class="new-chat-btn" onclick="location.reload()">+ Nouvelle discussion</button>
  </div>

  <div class="chat-container">
    <div class="chat-header">ASSTRA AI Assistant</div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">Bonjour ! Je suis **ASSTRA AI**. Comment puis-je vous aider aujourd'hui ? 🚀 Je peux chercher sur le web et analyser vos images !</div>
    </div>

    <div id="imagePreviewIndicator">📷 Image sélectionnée (Prئة للإرسال)</div>

    <div class="input-container">
      <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Vocal">🎙️</button>
      
      <label class="icon-btn" title="Envoyer une image" style="cursor: pointer;">
        📷
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(event)" />
      </label>

      <input type="text" id="userInput" placeholder="Écris ta question, pose une image ou parle..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">Envoyer 🚀</button>
    </div>
  </div>

  <script>
    let selectedImageBase64 = null;

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onloadend = function() {
        selectedImageBase64 = reader.result;
        const indicator = document.getElementById('imagePreviewIndicator');
        indicator.style.display = 'flex';
        indicator.textContent = `📷 Image prête : ${file.name}`;
      }
      reader.readAsDataURL(file);
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const messagesContainer = document.getElementById('chatMessages');
      const text = input.value.trim();

      if (!text && !selectedImageBase64) return;

      // Display User Message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.textContent = text + (selectedImageBase64 ? " [📷 Image]" : "");
      messagesContainer.appendChild(userDiv);

      const currentPrompt = text;
      const currentImage = selectedImageBase64;

      input.value = '';
      selectedImageBase64 = null;
      document.getElementById('imagePreviewIndicator').style.display = 'none';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Display Loading Assistant Message
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message assistant';
      loadingDiv.textContent = 'En train de réfléchir... ⏳';
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const response = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: currentPrompt, image: currentImage })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Erreur serveur');

        loadingDiv.innerHTML = marked.parse(data.reply);
      } catch (err) {
        loadingDiv.textContent = 'Erreur: ' + err.message;
      }
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Voice Input (STT)
    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("La reconnaissance vocale n'est pas supportée par votre navigateur.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.onresult = function(event) {
        document.getElementById('userInput').value = event.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }
  </script>
</body>
</html>
