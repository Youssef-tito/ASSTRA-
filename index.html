<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Découvrez ASSTRA AI, votre assistant intelligent basé sur l'IA pour apprendre, créer, résoudre des problèmes et explorer de nouvelles idées.">

<meta property="og:type" content="website">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
  --primary: #6857f5;
  --primary-dark: #5141df;
  --purple-light: #f1efff;
  --text: #25243a;
  --muted: #9290a3;
  --border: #e9e8f1;
  --background: #ffffff;
  --sidebar: #faf9fd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: var(--background);
  height: 100dvh;
  overflow: hidden;
}
button, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible {
  outline: 2px solid #a79bff;
  outline-offset: 2px;
}
.app { display: flex; height: 100dvh; overflow: hidden; }
.sidebar {
  width: 265px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 17px 13px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 5px 7px 23px; }
.logo {
  width: 42px; height: 42px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 14px;
  background: linear-gradient(140deg, #6252ee, #a855f7);
  box-shadow: 0 6px 17px #7564f53a;
}
.logo svg { width: 31px; height: 31px; }
.brand-name {
  font-size: 18px; font-weight: 850; letter-spacing: .5px;
  background: linear-gradient(100deg, #6252ee, #a855f7);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-sub { color: var(--muted); font-size: 10px; margin-top: 3px; }
.new-chat {
  display: flex; justify-content: center; align-items: center; gap: 9px;
  width: 100%; padding: 12px; border-radius: 12px;
  color: var(--primary-dark); background: white;
  border: 1px solid #e4dfff; font-size: 13px; font-weight: 700;
  transition: .2s;
}
.new-chat:hover { background: var(--purple-light); }
.section-label {
  margin: 26px 8px 11px; color: #a09caf;
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase;
}
.history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.history-item {
  display: flex; align-items: center; gap: 8px;
  padding: 10px; border-radius: 10px; cursor: pointer;
  color: #69677c; font-size: 12px;
}
.history-item:hover { background: #f1efff; }
.history-item.active { background: #eeebff; color: var(--primary-dark); }
.history-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.delete-chat {
  border: 0; background: transparent; color: #aaa;
  font-size: 17px; padding: 0 3px; flex-shrink: 0;
}
.delete-chat:hover { color: #d94662; }
.sidebar-footer {
  display: flex; align-items: center; gap: 10px;
  border-top: 1px solid var(--border); padding: 15px 5px 0;
}
.footer-logo {
  width: 34px; height: 34px; display: grid; place-items: center;
  background: #eeebff; color: var(--primary); border-radius: 11px;
}
.footer-title { font-size: 12px; font-weight: 750; }
.footer-sub { color: var(--muted); font-size: 10px; margin-top: 3px; }

.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
.header {
  height: 62px; flex-shrink: 0; display: flex;
  align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border); background: white;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-title { font-size: 14px; font-weight: 800; }
.model-label { padding: 5px 9px; border-radius: 20px; background: #f3f0ff; color: #7261d9; font-size: 10px; }
.online { display: flex; align-items: center; gap: 6px; color: #858398; font-size: 11px; }
.dot { width: 7px; height: 7px; background: #25c685; border-radius: 50%; }
.menu-btn {
  display: none; width: 37px; height: 37px;
  border: 0; border-radius: 10px; color: var(--primary);
  background: var(--purple-light); font-size: 20px;
}
.chat {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 28px 18px 35px; scroll-behavior: smooth;
}
.welcome { max-width: 680px; margin: 9vh auto 0; text-align: center; }
.welcome-logo {
  width: 68px; height: 68px; display: grid; place-items: center;
  margin: 0 auto 22px; border-radius: 23px;
  background: linear-gradient(140deg, #6252ee, #a855f7);
  box-shadow: 0 12px 34px #7564f52d;
}
.welcome-logo svg { width: 48px; height: 48px; }
.welcome h1 { font-size: clamp(25px, 4vw, 36px); letter-spacing: -1px; font-weight: 800; }
.gradient-text {
  background: linear-gradient(100deg, #6657f5, #b053ef);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.welcome p {
  max-width: 460px; margin: 13px auto 29px;
  color: var(--muted); font-size: 13px; line-height: 1.8;
}
.suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.suggestion {
  padding: 15px; background: white; border: 1px solid var(--border);
  border-radius: 14px; transition: .2s;
}
.suggestion:hover { border-color: #c9c0ff; background: #fcfbff; transform: translateY(-2px); }
.suggestion-icon { font-size: 19px; margin-bottom: 9px; }
.suggestion-title { font-size: 12px; font-weight: 750; }
.suggestion-sub { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 5px; }

.message-row {
  width: 100%; max-width: 790px; margin: 0 auto 25px;
  display: flex; align-items: flex-start; gap: 12px;
}
.message-row.user-row { justify-content: flex-end; }
.avatar {
  width: 32px; height: 32px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 11px; font-size: 14px;
}
.ai-avatar { color: white; background: linear-gradient(140deg, #6657f5, #a855f7); }
.user-avatar { color: #6657f5; background: #eeebff; }
.message {
  max-width: calc(100% - 44px); min-width: 0;
  font-size: 14px; line-height: 1.8; overflow-wrap: anywhere;
}
.message.user { padding: 11px 15px; border-radius: 17px 17px 4px 17px; background: #f0eeff; }
.message.assistant { flex: 1; padding: 2px 0; }
.message p { margin-bottom: 10px; }
.message p:last-child { margin-bottom: 0; }
.message h1, .message h2, .message h3 { line-height: 1.4; margin: 16px 0 8px; }
.message h1 { font-size: 22px; } .message h2 { font-size: 18px; } .message h3 { font-size: 15px; }
.message ul, .message ol { padding-left: 23px; margin: 8px 0; }
.message li { margin: 4px 0; }
.message blockquote { border-left: 3px solid #b5a8ff; padding-left: 12px; margin: 10px 0; color: #68647b; }
.message pre {
  overflow: auto; padding: 14px; margin: 10px 0;
  background: #f6f5fa; border: 1px solid var(--border);
  border-radius: 11px; font-size: 12px;
}
.message code { padding: 2px 4px; background: #f0eef8; border-radius: 4px; font-family: Consolas, monospace; font-size: .9em; }
.message pre code { padding: 0; background: transparent; }
.message a { color: var(--primary-dark); text-decoration: underline; }
.message table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
.message th, .message td { padding: 7px; border: 1px solid var(--border); text-align: left; }
.message-image {
  display: block; max-width: min(280px, 100%); max-height: 300px;
  object-fit: contain; margin-top: 9px; border: 1px solid var(--border); border-radius: 12px;
}
.typing { display: flex; gap: 5px; padding: 12px 0; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%; background: #9585f5;
  animation: bounce .8s infinite alternate;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { to { opacity: .3; transform: translateY(-4px); } }

.composer-area { padding: 12px 18px max(13px, env(safe-area-inset-bottom)); background: white; }
.composer-wrap { max-width: 790px; margin: 0 auto; }
.image-preview {
  display: none; align-items: center; gap: 10px;
  padding: 8px; margin-bottom: 10px; background: #f5f2ff; border-radius: 12px;
}
.image-preview img { width: 47px; height: 47px; object-fit: cover; border-radius: 8px; }
.preview-label { flex: 1; color: var(--primary-dark); font-size: 12px; }
.remove-image { width: 29px; height: 29px; border: 0; border-radius: 8px; background: white; color: #d94662; }
.composer {
  display: flex; align-items: flex-end; gap: 8px; padding: 8px 9px;
  background: white; border: 1px solid #dedce9; border-radius: 18px;
  box-shadow: 0 4px 20px #24204a08; transition: .2s;
}
.composer:focus-within { border-color: #b4a8ff; box-shadow: 0 0 0 3px #7564f510; }
.icon-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  border: 0; border-radius: 11px; background: #f3f0ff;
  color: var(--primary); font-size: 20px;
  display: grid; place-items: center; transition: .2s;
}
.icon-btn:hover { background: #e8e3ff; }
.icon-btn.recording {
  background: #e54865; color: white;
  animation: pulse 1s infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 0 5px #e5486525; } }

.composer textarea {
  flex: 1; min-width: 0; max-height: 150px; resize: none;
  padding: 10px 3px; border: 0; outline: 0;
  background: transparent; color: var(--text); font-size: 14px; line-height: 1.5;
}
.send-btn {
  width: 39px; height: 39px; flex-shrink: 0;
  display: grid; place-items: center; border: 0; border-radius: 12px;
  background: linear-gradient(140deg, #6657f5, #8b5cf6);
  color: white; font-size: 22px; transition: .2s;
}
.send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px #6657f54a; }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }
.disclaimer { margin-top: 9px; color: #a09eac; font-size: 10px; text-align: center; }
.overlay { display: none; }

@media(max-width:768px) {
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(285px, 86vw); height: 100dvh; transform: translateX(-105%); transition: transform .25s; box-shadow: none; }
  .sidebar.open { transform: translateX(0); box-shadow: 10px 0 40px #17132b12; }
  .overlay.open { display: block; position: fixed; inset: 0; z-index: 9; background: #15132655; }
  .menu-btn { display: block; }
  .header { height: 57px; padding: 0 12px; }
  .chat { padding: 20px 12px; }
  .welcome { margin-top: 7vh; }
  .welcome-logo { width: 59px; height: 59px; border-radius: 20px; }
  .welcome h1 { font-size: 27px; }
  .welcome p { font-size: 12px; margin-bottom: 22px; }
  .suggestions { gap: 8px; }
  .suggestion { padding: 12px; }
  .suggestion-sub { font-size: 10px; }
  .message-row { gap: 9px; margin-bottom: 21px; }
  .message { font-size: 13px; }
  .composer-area { padding: 9px 10px max(10px, env(safe-area-inset-bottom)); }
  .composer { border-radius: 16px; }
  .disclaimer { font-size: 9px; }
}
@media(max-width:360px) {
  .model-label { display: none; }
  .suggestions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 3L30 18L45 24L30 30L24 45L18 30L3 24L18 18Z" fill="white"/>
          <circle cx="36" cy="10" r="3" fill="#DDD6FE"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">ASSTRA AI</div>
        <div class="brand-sub">Intelligence, autrement.</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">＋ Nouvelle discussion</button>
    <div class="section-label">Discussions récentes</div>
    <div class="history" id="historyList"></div>

    <div class="sidebar-footer">
      <div class="footer-logo">✦</div>
      <div>
        <div class="footer-title">ASSTRA AI</div>
        <div class="footer-sub">Votre assistant intelligent</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-left">
        <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
        <div class="header-title">ASSTRA AI</div>
        <span class="model-label">Gemini 1.5 Flash ⚡</span>
      </div>
      <div class="online"><span class="dot"></span> Prêt à vous aider</div>
    </header>

    <section class="chat" id="chatMessages" aria-live="polite"></section>

    <footer class="composer-area">
      <div class="composer-wrap">
        <div class="image-preview" id="imagePreview">
          <img id="previewImg" alt="Image sélectionnée">
          <div class="preview-label">Image prête à envoyer</div>
          <button class="remove-image" id="removeImageBtn" aria-label="Retirer l'image">×</button>
        </div>
        <div class="composer">
          <button class="icon-btn" id="micBtn" title="Enregistrement vocal" aria-label="Parler">🎙️</button>
          <button class="icon-btn" id="imageBtn" title="Ajouter une image" aria-label="Ajouter une image">＋</button>
          <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden>
          <textarea id="userInput" rows="1" maxlength="20000" placeholder="Écrivez votre message ou parlez... 💬" aria-label="Votre message"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Envoyer">↑</button>
        </div>
        <div class="disclaimer">ASSTRA AI peut faire des erreurs. Vérifiez les informations importantes.</div>
      </div>
    </footer>
  </main>
</div>

<script>
"use strict";

const STORAGE_KEY = "asstra_ai_conversations_v5";
const MAX_IMAGE_SIZE = 5 * 1024 * 1024;
let conversations = [];
let activeConversationId = null;
let selectedImage = null;
let isSending = false;
let requestController = null;
let recognition = null;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) {
    conversations = saved.filter(c =>
      c && typeof c.id === "string" && Array.isArray(c.messages)
    );
  }
} catch (error) {
  console.warn("Impossible de lire l'historique local.");
}

const $ = id => document.getElementById(id);
const chatMessages = $("chatMessages");
const historyList = $("historyList");
const userInput = $("userInput");
const sendBtn = $("sendBtn");
const imageInput = $("imageInput");
const imagePreview = $("imagePreview");
const previewImg = $("previewImg");
const sidebar = $("sidebar");
const overlay = $("overlay");
const micBtn = $("micBtn");

function makeId() {
  return window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getActive() {
  return conversations.find(c => c.id === activeConversationId);
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  } catch (error) {
    console.warn("Historique local plein ou indisponible.");
  }
}

function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("open");
}

function clearImage() {
  selectedImage = null;
  imageInput.value = "";
  previewImg.removeAttribute("src");
  imagePreview.style.display = "none";
}

function newConversation() {
  if (isSending) return;
  const c = {
    id: makeId(),
    title: "Nouvelle discussion",
    messages: [],
    updatedAt: Date.now()
  };
  conversations.unshift(c);
  activeConversationId = c.id;
  clearImage();
  closeSidebar();
  saveAndRender();
  userInput.focus();
}

function openConversation(id) {
  if (isSending) return;
  if (!conversations.some(c => c.id === id)) return;
  activeConversationId = id;
  clearImage();
  closeSidebar();
  saveAndRender();
}

function deleteConversation(id) {
  if (isSending) return;
  conversations = conversations.filter(c => c.id !== id);
  if (activeConversationId === id) {
    activeConversationId = conversations[0]?.id || null;
  }
  if (!activeConversationId) {
    const c = {
      id: makeId(),
      title: "Nouvelle discussion",
      messages: [],
      updatedAt: Date.now()
    };
    conversations.unshift(c);
    activeConversationId = c.id;
  }
  saveAndRender();
}

function saveAndRender() {
  save();
  renderHistory();
  renderChat();
}

function renderHistory() {
  historyList.replaceChildren();

  conversations.forEach(c => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (c.id === activeConversationId ? " active" : "");

    const icon = document.createElement("span");
    icon.textContent = "◷";

    const name = document.createElement("span");
    name.className = "history-name";
    name.textContent = c.title || "Nouvelle discussion";

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.type = "button";
    del.textContent = "×";
    del.title = "Supprimer la discussion";
    del.setAttribute("aria-label", "Supprimer la discussion");

    item.append(icon, name, del);
    item.addEventListener("click", () => openConversation(c.id));

    del.addEventListener("click", event => {
      event.stopPropagation();
      if (confirm("Supprimer cette discussion ?")) {
        deleteConversation(c.id);
      }
    });

    historyList.appendChild(item);
  });
}

function addWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.innerHTML = `
    <div class="welcome-logo">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 3L30 18L45 24L30 30L24 45L18 30L3 24L18 18Z" fill="white"/>
        <circle cx="36" cy="10" r="3" fill="#DDD6FE"/>
      </svg>
    </div>
    <h1>Bonjour, bienvenue sur<br><span class="gradient-text">ASSTRA AI</span> 🌟</h1>
    <p>Votre espace intelligent pour apprendre, créer, résoudre des problèmes et explorer de nouvelles idées.</p>
    <div class="suggestions">
      <button class="suggestion" data-prompt="Aide-moi à trouver des idées créatives pour un projet. 💡">
        <div class="suggestion-icon">✧</div>
        <div class="suggestion-title">Créativité et idées 💡</div>
        <div class="suggestion-sub">Trouver l'inspiration pour un projet</div>
      </button>
      <button class="suggestion" data-prompt="Explique-moi un concept informatique simplement, étape par étape. 💻">
        <div class="suggestion-icon">⌘</div>
        <div class="suggestion-title">Programmation 💻</div>
        <div class="suggestion-sub">Comprendre et écrire du code</div>
      </button>
      <button class="suggestion" data-prompt="Donne-moi une méthode simple pour mieux apprendre et réviser. 📚">
        <div class="suggestion-icon">✎</div>
        <div class="suggestion-title">Apprentissage 📚</div>
        <div class="suggestion-sub">Réviser et mieux comprendre</div>
      </button>
      <button class="suggestion" data-prompt="Je veux analyser une image. Explique-moi comment tu peux m'aider. 🖼️">
        <div class="suggestion-icon">▧</div>
        <div class="suggestion-title">Images et analyse 🖼️</div>
        <div class="suggestion-sub">Comprendre une photo ou un document</div>
      </button>
    </div>`;

  welcome.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      userInput.value = button.dataset.prompt;
      resizeInput();
      userInput.focus();
    });
  });

  chatMessages.appendChild(welcome);
}

function appendMessage(m) {
  const row = document.createElement("div");
  row.className = "message-row" +
    (m.role === "user" ? " user-row" : "");

  const avatar = document.createElement("div");
  avatar.className = "avatar " +
    (m.role === "user" ? "user-avatar" : "ai-avatar");
  avatar.textContent = m.role === "user" ? "●" : "✦";
  avatar.setAttribute("aria-hidden", "true");

  const bubble = document.createElement("div");
  bubble.className = "message " +
    (m.role === "user" ? "user" : "assistant");

  if (m.text) {
    if (m.role === "user") {
      bubble.textContent = m.text;
      bubble.style.whiteSpace = "pre-wrap";
    } else {
      const raw = window.marked
        ? marked.parse(m.text, { breaks: true })
        : m.text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      bubble.innerHTML = window.DOMPurify
        ? DOMPurify.sanitize(raw)
        : raw;
    }
  }

  if (m.image) {
    const img = document.createElement("img");
    img.className = "message-image";
    img.src = m.image;
    img.alt = "Image envoyée";
    img.loading = "lazy";
    bubble.appendChild(img);
  }

  if (m.role === "user") row.append(bubble, avatar);
  else row.append(avatar, bubble);

  chatMessages.appendChild(row);
}

function renderChat() {
  chatMessages.replaceChildren();
  const c = getActive();

  if (!c || c.messages.length === 0) {
    addWelcome();
    return;
  }

  c.messages.forEach(appendMessage);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "message-row";
  row.id = "typingIndicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar ai-avatar";
  avatar.textContent = "✦";

  const dots = document.createElement("div");
  dots.className = "typing";
  dots.innerHTML = "<span></span><span></span><span></span>";

  row.append(avatar, dots);
  chatMessages.appendChild(row);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() {
  $("typingIndicator")?.remove();
}

function resizeInput() {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 150) + "px";
}

function imageToPart(dataUrl) {
  const match = /^data:(image\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=\r\n]+)$/.exec(dataUrl);
  if (!match) return null;
  return {
    inline_data: {
      mime_type: match[1],
      data: match[2].replace(/\s/g, "")
    }
  };
}

if (micBtn && ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-TN';
  recognition.interimResults = false;

  micBtn.onclick = () => {
    try {
      recognition.start();
      micBtn.classList.add("recording");
    } catch (e) {
      console.error(e);
    }
  };

  recognition.onresult = (event) => {
    const speechToText = event.results[0][0].transcript;
    userInput.value += (userInput.value ? " " : "") + speechToText;
    resizeInput();
    micBtn.classList.remove("recording");
  };

  recognition.onerror = () => micBtn.classList.remove("recording");
  recognition.onend = () => micBtn.classList.remove("recording");
} else if (micBtn) {
  micBtn.style.display = "none";
}

$("newChatBtn").addEventListener("click", newConversation);
$("menuBtn").addEventListener("click", () => {
  sidebar.classList.add("open");
  overlay.classList.add("open");
});
overlay.addEventListener("click", closeSidebar);

$("imageBtn").addEventListener("click", () => imageInput.click());
$("removeImageBtn").addEventListener("click", clearImage);

imageInput.addEventListener("change", event => {
  const file = event.target.files?.[0];
  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Choisissez une image JPG, PNG ou WEBP.");
    clearImage();
    return;
  }
  if (file.size > MAX_IMAGE_SIZE) {
    alert("L'image est trop grande. Choisissez une image de 5 Mo maximum.");
    clearImage();
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    selectedImage = reader.result;
    previewImg.src = selectedImage;
    imagePreview.style.display = "flex";
  };
  reader.onerror = () => alert("Impossible de lire cette image.");
  reader.readAsDataURL(file);
});

userInput.addEventListener("input", resizeInput);

userInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener("click", sendMessage);

async function sendMessage() {
  if (isSending) return;

  let text = userInput.value.trim();
  if (!text && !selectedImage) return;

  const lowerText = text.toLowerCase();
  if (lowerText.includes("انشئ صورة") || lowerText.includes("crée une image") || lowerText.includes("génère une image") || lowerText.includes("رسم لي")) {
    let c = getActive();
    if (!c) {
      c = { id: makeId(), title: "Nouvelle discussion", messages: [], updatedAt: Date.now() };
      conversations.unshift(c);
      activeConversationId = c.id;
    }
    const userMessage = { role: "user", text, image: null };
    c.messages.push(userMessage);
    if (c.messages.length === 1) c.title = text.slice(0, 42);
    
    userInput.value = "";
    userInput.style.height = "auto";
    saveAndRender();

    showTyping();
    setTimeout(() => {
      removeTyping();
      const promptClean = encodeURIComponent(text);
      const generatedImageUrl = `https://image.pollinations.ai/prompt/${promptClean}`;
      c.messages.push({
        role: "model",
        text: "✨ **إليك الصورة التي طلبتها :**",
        image: generatedImageUrl
      });
      c.updatedAt = Date.now();
      saveAndRender();
    }, 1200);
    return;
  }

  let c = getActive();
  if (!c) {
    c = {
      id: makeId(),
      title: "Nouvelle discussion",
      messages: [],
      updatedAt: Date.now()
    };
    conversations.unshift(c);
    activeConversationId = c.id;
  }

  const imgToSend = selectedImage;
  const imagePart = imgToSend ? imageToPart(imgToSend) : null;

  if (imgToSend && !imagePart) {
    alert("Format d'image non valide.");
    return;
  }

  const userMessage = {
    role: "user",
    text,
    image: imgToSend || null
  };

  const previousMessages = c.messages.slice(-20);

  c.messages.push(userMessage);

  if (c.messages.length === 1) {
    c.title = (text || "Analyse d'image").slice(0, 42);
  }

  c.updatedAt = Date.now();
  userInput.value = "";
  userInput.style.height = "auto";
  clearImage();

  saveAndRender();

  isSending = true;
  sendBtn.disabled = true;
  $("imageBtn").disabled = true;
  $("newChatBtn").disabled = true;
  if (micBtn) micBtn.disabled = true;
  showTyping();

  const contents = previousMessages.map(m => {
    const parts = [];
    if (m.text) parts.push({ text: m.text });
    if (m.image) {
      const part = imageToPart(m.image);
      if (part) parts.push(part);
    }
    return {
      role: m.role === "user" ? "user" : "model",
      parts: parts.length ? parts : [{ text: " " }]
    };
  });

  requestController = new AbortController();

  try {
    const response = await fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: requestController.signal,
      body: JSON.stringify({
        prompt: text,
        image: imgToSend,
        contents
      })
    });

    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error("Réponse invalide du serveur.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Erreur du serveur.");
    }

    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("L'assistant n'a pas renvoyé de réponse.");
    }

    c.messages.push({ role: "model", text: data.reply });
  } catch (error) {
    const message = error.name === "AbortError"
      ? "Requête annulée."
      : error.message === "Failed to fetch"
        ? "Connexion impossible. Vérifiez votre connexion et le déploiement de l'API."
        : error.message || "Une erreur est survenue.";

    c.messages.push({
      role: "model",
      text: "⚠️ **Erreur :** " + message
    });
  } finally {
    removeTyping();
    isSending = false;
    requestController = null;
    sendBtn.disabled = false;
    $("imageBtn").disabled = false;
    $("newChatBtn").disabled = false;
    if (micBtn) micBtn.disabled = false;
    c.updatedAt = Date.now();

    conversations.sort((a, b) => b.updatedAt - a.updatedAt);
    activeConversationId = c.id;
    saveAndRender();
    userInput.focus();
  }
}

if (conversations.length === 0) {
  const c = {
    id: makeId(),
    title: "Nouvelle discussion",
    messages: [],
    updatedAt: Date.now()
  };
  conversations.push(c);
  activeConversationId = c.id;
} else {
  conversations.sort((a, b) => b.updatedAt - a.updatedAt);
  activeConversationId = conversations[0].id;
}

saveAndRender();
</script>
</body>
</html>
