<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASSTRA AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f7f9fc; color: #333; }
    
    /* Sidebar */
    .sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid #e1e8ed; display: flex; flex-direction: column; padding: 20px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
    .brand h2 { color: #6c5ce7; font-size: 22px; font-weight: 700; }
    .btn-new { background-color: #6c5ce7; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-new:hover { background-color: #5b4bc4; }

    /* Main Chat */
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { height: 60px; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; padding: 0 25px; background: #fff; font-weight: 600; font-size: 16px; }
    .chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* Messages */
    .msg { max-width: 70%; padding: 14px 18px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
    .msg.user { background-color: #6c5ce7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.bot { background-color: #ffffff; color: #2d3436; align-self: flex-start; border: 1px solid #e1e8ed; border-bottom-left-radius: 2px; }
    
    /* Input Area */
    .input-container { padding: 20px; background-color: #ffffff; border-top: 1px solid #e1e8ed; display: flex; gap: 12px; }
    .input-container input { flex: 1; padding: 14px; border: 1px solid #dfe6e9; border-radius: 10px; outline: none; font-size: 15px; }
    .input-container input:focus { border-color: #6c5ce7; }
    .input-container button { background-color: #6c5ce7; color: white; border: none; padding: 0 25px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .input-container button:hover { background-color: #5b4bc4; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <!-- يمكنك وضع رابط صورة اللوجو الخاصة بك مكان logo.png -->
      <img src="logo.png" onerror="this.src='https://via.placeholder.com/40/6c5ce7/ffffff?text=AI'" alt="Logo" />
      <h2>ASSTRA AI</h2>
    </div>
    <button class="btn-new" onclick="location.reload()">+ Nouvelle discussion</button>
  </div>

  <div class="main">
    <div class="header">ASSTRA AI Assistant</div>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">Bonjour ! Comment puis-je vous aider aujourd'hui ?</div>
    </div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Écris ta question ici..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">Envoyer 🚀</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = input.value.trim();

      if (!text) return;

      // أضف رسالة المستخدم
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // أضف مؤشر الانتظار
      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = 'Réflexion en cours...';
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();
        if (data.reply) {
          botMsg.textContent = data.reply;
        } else {
          botMsg.textContent = "Erreur: " + (data.error || "Impossible de répondre.");
        }
      } catch (err) {
        botMsg.textContent = "Erreur de connexion avec le serveur.";
      }
      
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
