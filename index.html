<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASSTRA AI - Assistant Intelligent</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ASSTRA AI - Votre assistant intelligent.">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <style>
    :root {
      --primary: #6657f5;
      --primary-dark: #5141df;
      --background: #f8f9fd;
      --white: #ffffff;
      --text: #20243a;
      --muted: #8b90a5;
      --border: #e9eaf2;
      --sidebar-width: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--background); color: var(--text); height: 100dvh; overflow: hidden; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    
    .app { display: flex; width: 100%; height: 100dvh; position: relative; overflow: hidden; }
    
    /* SIDEBAR */
    .sidebar { width: var(--sidebar-width); flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; z-index: 30; transition: transform 0.3s ease; height: 100%; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand-logo { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #6657f5, #a855f7); display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
    .brand-name { font-size: 17px; font-weight: 800; background: linear-gradient(135deg, #6657f5, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .new-chat-btn { width: 100%; border: 0; padding: 11px; border-radius: 10px; background: linear-gradient(135deg, #6657f5, #7665fa); color: white; font-size: 13px; font-weight: 650; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .history-title { margin: 20px 5px 10px; color: var(--muted); font-size: 10px; font-weight: 750; text-transform: uppercase; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { display: flex; align-items: center; gap: 8px; padding: 10px 8px; border-radius: 8px; color: #646981; font-size: 12px; cursor: pointer; }
    .history-item:hover { background: #f5f4ff; }
    .history-item.active { background: #efedff; color: var(--primary-dark); }
    .history-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; background: var(--background); }
    .header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: white; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .menu-btn { background: #f4f3ff; border: 0; color: var(--primary); width: 36px; height: 36px; border-radius: 8px; font-size: 18px; display: none; align-items: center; justify-content: center; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 16px; }
    .message-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
    .message-row.user-row { justify-content: flex-end; }
    .avatar { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
    .assistant-avatar { color: white; background: linear-gradient(135deg, #6657f5, #a855f7); }
    .user-avatar { background: #eeecff; }
    .message { max-width: calc(100% - 40px); padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .message.user { background: linear-gradient(135deg, #6657f5, #7465f7); color: white; border-bottom-right-radius: 2px; }
    .message.assistant { background: white; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .message-image { display: block; max-width: 200px; max-height: 200px; object-fit: contain; margin-top: 6px; border-radius: 8px; }

    /* IMAGE PREVIEW */
    .image-preview { display: none; align-items: center; gap: 10px; padding: 8px 15px; background: #f1efff; border-top: 1px solid #e6e1ff; }
    .image-preview img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .remove-image { border: 0; background: white; width: 26px; height: 26px; border-radius: 6px; color: #dc4965; font-size: 15px; cursor: pointer; }

    /* COMPOSER */
    .composer-area { background: white; border-top: 1px solid var(--border); padding: 10px 12px; flex-shrink: 0; }
    .composer { width: 100%; display: flex; align-items: flex-end; gap: 8px; padding: 6px 10px; border: 1px solid #dedff0; border-radius: 14px; background: white; }
    .icon-btn { background: transparent; border: 0; font-size: 18px; cursor: pointer; padding: 5px; color: #777c94; }
    .composer textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 6px 2px; font-size: 13px; background: transparent; max-height: 120px; }
    .send-btn { height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: linear-gradient(135deg, #6657f5, #7665fa); color: white; font-weight: 700; font-size: 12px; flex-shrink: 0; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 25; }

    /* MOBILE RESPONSIVE FIX */
    @media (max-width: 768px) {
      .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: flex; }
      .overlay.open { display: block; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">✨</div>
      <div class="brand-name">ASSTRA AI</div>
    </div>
    <button class="new-chat-btn" id="newChatBtn"><span>＋</span> Nouvelle discussion</button>
    <div class="history-title">Discussions récentes</div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <strong>ASSTRA AI Assistant</strong>
      <div style="width: 36px;"></div>
    </header>

    <section class="chat-messages" id="chatMessages"></section>

    <div class="image-preview" id="imagePreview">
      <img id="previewImg" alt="Aperçu">
      <div style="flex:1; font-size:12px; color:#5c4cda;"><strong>Image prête</strong></div>
      <button class="remove-image" id="removeImageBtn">×</button>
    </div>

    <footer class="composer-area">
      <div class="composer">
        <button class="icon-btn" id="imageBtn">📷</button>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden>
        <textarea id="userInput" rows="1" placeholder="Écris ta question ou pose une image..."></textarea>
        <button class="send-btn" id="sendBtn">Envoyer 🚀</button>
      </div>
    </footer>
  </main>
</div>

<script>
  const STORAGE_KEY = "asstra_ai_conversations_v3";
  let conversations = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let activeConversationId = null;
  let selectedImage = null;
  let isSending = false;

  const chatMessages = document.getElementById("chatMessages");
  const historyList = document.getElementById("historyList");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const imageInput = document.getElementById("imageInput");
  const imageBtn = document.getElementById("imageBtn");
  const imagePreview = document.getElementById("imagePreview");
  const previewImg = document.getElementById("previewImg");
  const removeImageBtn = document.getElementById("removeImageBtn");
  const menuBtn = document.getElementById("menuBtn");
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("overlay");

  menuBtn.onclick = () => { sidebar.classList.add("open"); overlay.classList.add("open"); };
  overlay.onclick = () => { sidebar.classList.remove("open"); overlay.classList.remove("open"); };

  if (conversations.length === 0) createConversation();
  else openConversation(conversations[0].id);

  function createConversation() {
    const c = { id: Date.now().toString(), title: "Nouvelle discussion", messages: [], updatedAt: Date.now() };
    conversations.unshift(c);
    activeConversationId = c.id;
    saveAndRender();
  }

  function openConversation(id) {
    activeConversationId = id;
    clearImage();
    sidebar.classList.remove("open");
    overlay.classList.remove("open");
    saveAndRender();
  }

  function getActive() {
    return conversations.find(c => c.id === activeConversationId);
  }

  function saveAndRender() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); } catch {}
    renderHistory();
    renderChat();
  }

  function renderHistory() {
    historyList.replaceChildren();
    conversations.forEach(c => {
      const item = document.createElement("div");
      item.className = "history-item " + (c.id === activeConversationId ? "active" : "");
      item.innerHTML = `<span>💬</span><span class="history-name">${c.title}</span>`;
      item.onclick = () => openConversation(c.id);
      historyList.appendChild(item);
    });
  }

  function renderChat() {
    chatMessages.replaceChildren();
    const c = getActive();
    if (!c || c.messages.length === 0) {
      chatMessages.innerHTML = `<div style="text-align:center; margin:auto; padding:20px;"><h1>Bienvenue sur <span style="color:#6657f5;">ASSTRA AI</span></h1><p style="color:#8b90a5; font-size:13px; margin-top:8px;">Posez vos questions ou envoyez une photo !</p></div>`;
      return;
    }
    c.messages.forEach(m => {
      const row = document.createElement("div");
      row.className = "message-row " + (m.role === "user" ? "user-row" : "");
      row.innerHTML = `<div class="avatar ${m.role === 'user' ? 'user-avatar' : 'assistant-avatar'}">${m.role === 'user' ? '👤' : '✦'}</div>
                       <div class="message ${m.role}">${m.text ? marked.parse(m.text) : ''}${m.image ? `<img src="${m.image}" class="message-image">` : ''}</div>`;
      chatMessages.appendChild(row);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  imageBtn.onclick = () => imageInput.click();
  imageInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      selectedImage = reader.result;
      previewImg.src = selectedImage;
      imagePreview.style.display = "flex";
    };
    reader.readAsDataURL(file);
  };

  removeImageBtn.onclick = clearImage;
  function clearImage() {
    selectedImage = null;
    imageInput.value = "";
    imagePreview.style.display = "none";
  }

  document.getElementById("newChatBtn").onclick = createConversation;

  sendBtn.onclick = async () => {
    if (isSending) return;
    const text = userInput.value.trim();
    if (!text && !selectedImage) return;

    const c = getActive();
    if (!c) return;

    const userMsg = { role: "user", text, image: selectedImage };
    c.messages.push(userMsg);
    if (c.messages.length === 1) c.title = text ? text.slice(0, 30) : "Analyse d'image";
    
    userInput.value = "";
    const imgToSend = selectedImage;
    clearImage();
    saveAndRender();

    isSending = true;
    sendBtn.disabled = true;

    const historyPayload = c.messages.slice(0, -1).map(m => ({
      role: m.role,
      parts: [{ text: m.text || "" }]
    }));

    try {
      const res = await fetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: text,
          image: imgToSend,
          contents: historyPayload
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur serveur");

      c.messages.push({ role: "model", text: data.reply });
    } catch (err) {
      c.messages.push({ role: "model", text: "⚠️ Erreur: " + err.message });
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      c.updatedAt = Date.now();
      saveAndRender();
    }
  };
</script>
</body>
</html>
