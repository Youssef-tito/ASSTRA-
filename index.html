<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASSTRA AI — Your intelligence, amplified</title>

<style>
:root {
  --bg: #ffffff;
  --panel: #f8fafc;
  --line: #e2e8f0;
  --purple: #7c3aed;
  --purple2: #6d28d9;
  --purple-light: #f3e8ff;
  --text: #0f172a;
  --muted: #64748b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% -20%, #f3e8ff 0%, transparent 50%), var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
  height: 100vh;
  overflow: hidden;
}
button, textarea { font: inherit; }
button { cursor: pointer; }
.app {
  height: 100vh;
  display: grid;
  grid-template-columns: 280px 1fr;
  max-width: 1800px;
  margin: auto;
}
.sidebar {
  background: #fcfcfd;
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 8px 22px;
  border-bottom: 1px solid var(--line);
}
.logo { width: 40px; height: 40px; }
.brand-name { font-weight: 900; letter-spacing: 2px; font-size: 17px; color: var(--purple2); }
.new-chat {
  margin: 19px 0 23px;
  border: 1px solid var(--purple);
  background: linear-gradient(110deg, var(--purple), var(--purple2));
  color: white;
  border-radius: 13px;
  padding: 12px 14px;
  font-weight: 700;
}
.main { display: flex; flex-direction: column; position: relative; background: var(--bg); }
.topbar {
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 27px;
  border-bottom: 1px solid var(--line);
}
.messages { flex: 1; overflow: auto; padding: 35px 22px; }
.inner { max-width: 850px; margin: 0 auto; }
.message { display: flex; gap: 12px; margin-bottom: 24px; }
.bubble {
  max-width: calc(100% - 45px);
  padding: 14px 16px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 4px 16px 16px 16px;
}
.message.user { flex-direction: row-reverse; }
.message.user .bubble {
  background: linear-gradient(110deg, var(--purple), var(--purple2));
  color: white;
  border: none;
  border-radius: 16px 4px 16px 16px;
}
.composer-wrap { padding: 14px 22px 19px; border-top: 1px solid var(--line); }
.composer {
  max-width: 850px;
  margin: auto;
  border: 1px solid #cbd5e1;
  border-radius: 20px;
  padding: 10px;
  display: flex;
  gap: 10px;
}
textarea { flex: 1; border: 0; outline: 0; resize: none; height: 40px; }
.send {
  border: 0;
  border-radius: 11px;
  background: linear-gradient(110deg, var(--purple), var(--purple2));
  color: white;
  padding: 0 20px;
  font-weight: 800;
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">ASSTRA AI</div>
    </div>
    <button class="new-chat" onclick="location.reload()">＋ Nouvelle discussion</button>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><b>ASSTRA AI Assistant</b></div>
    </header>
    <section class="messages">
      <div class="inner" id="stream"></div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Écris ta question ici..."></textarea>
        <button class="send" type="submit">Envoyer ↗</button>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const promptBox = document.getElementById('prompt');
const stream = document.getElementById('stream');

function drawMessage(role, text) {
  const row = document.createElement('div');
  row.className = 'message ' + (role === 'user' ? 'user' : 'ai');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'user') {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = marked.parse(text);
  }
  row.append(bubble);
  stream.append(row);
  return row;
}

document.getElementById('chatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = promptBox.value.trim();
  if (!text) return;

  drawMessage('user', text);
  promptBox.value = '';

  const loading = drawMessage('model', 'ASSTRA AI réfléchit...');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text })
    });
    const data = await res.json();
    loading.remove();

    if (!res.ok) throw new Error(data.error || 'Erreur API');
    drawMessage('model', data.reply);
  } catch (err) {
    loading.remove();
    drawMessage('model', 'Erreur: ' + err.message);
  }
});
</script>
</body>
</html>
